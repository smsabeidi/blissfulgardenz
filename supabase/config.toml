# The Supabase project, in git.
#
# Until now the auth configuration lived only in the dashboard, which meant the
# answer to "which sign-in methods does this site have, and what are the rules"
# was a click path rather than a file. This is that answer.
#
# ─────────────────────────────────────────────────────────────────────────────
# HOW TO APPLY IT:  supabase config push
#
# READ THIS BEFORE YOU RUN IT. `config push` sends the WHOLE auth configuration,
# and there is no `config pull` to read the remote state first. Anything absent
# from this file reverts to the CLI's default — so the provider secrets below
# MUST be present in your environment at push time, or the push will disable
# sign-in methods that are currently live.
#
#   export $(grep -v '^#' .env.supabase | xargs)   # or however you prefer
#   supabase config push
#
# The CLI prints a diff and asks before it writes. Read the diff. If it proposes
# removing or changing Google, stop: something in your environment is missing.
# ─────────────────────────────────────────────────────────────────────────────

project_id = "blissgardenz"

[api]
enabled = true
# Supabase project defaults. Stated rather than omitted, because `config push`
# would otherwise send whatever the CLI considers default and we would only find
# out afterwards.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enabled = true

# The base URL of the site, used to build every link inside an auth email.
#
# Written out rather than read from env(NEXT_PUBLIC_SITE_URL) on purpose. That
# variable is "http://localhost:3000" in a developer's .env.local, and pushing
# from a shell that had loaded it would point every confirmation and reset link
# in production at localhost. It is not a secret; the literal is safer.
site_url = "https://www.blissfulgardenz.com"

# THE ALLOW-LIST.
#
# Supabase only honours a `redirect_to` that appears here. It once contained the
# Site URL and nothing else, which is why every sign-in came back to the home
# page carrying its credential in the query string and why
# `components/garden/auth-landing.tsx` exists to rescue it. Two real accounts
# were created that never reached the garden.
#
# By the time this file was first pushed, someone had already patched that by
# adding `https://www.blissfulgardenz.com/**`. A wildcard does work, and it is
# replaced here rather than kept: it approves every path on the origin forever,
# including ones that do not exist yet, and an allow-list is only worth having
# if it is a list. These six are the only redirect targets the app actually
# uses — two routes, three origins.
#
# Note the apex domain as well as www. Someone who types the address without
# the www gets served, and a sign-in that works on one host and mysteriously
# fails on the other is a bug nobody reports clearly.
# EACH ROUTE APPEARS TWICE, AND THE `?**` TWIN IS NOT OPTIONAL.
#
# The allow-list is a glob matched against the WHOLE url, query string included,
# where the only separator characters are `.` and `/`. A bare
# ".../auth/callback" therefore does NOT match the redirect the app actually
# sends, which is ".../auth/callback?next=%2Fgarden" — Supabase finds no match,
# silently falls back to site_url, and drops the person on the marketing home
# page instead of in the garden, losing `next` on the way.
#
# The previous "https://www.blissfulgardenz.com/**" hid this, because it matched
# everything on the origin. Narrowing it to exact paths was right, but exact
# paths alone quietly broke Google sign-in until the query form was added back.
# `**` rather than `*`: `*` stops at `.` and `/`, and a query string can contain
# either.
additional_redirect_urls = [
  "https://www.blissfulgardenz.com/auth/callback",
  "https://www.blissfulgardenz.com/auth/callback?**",
  "https://www.blissfulgardenz.com/auth/confirm",
  "https://www.blissfulgardenz.com/auth/confirm?**",
  "https://blissfulgardenz.com/auth/callback",
  "https://blissfulgardenz.com/auth/callback?**",
  "https://blissfulgardenz.com/auth/confirm",
  "https://blissfulgardenz.com/auth/confirm?**",
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/auth/callback?**",
  "http://localhost:3000/auth/confirm",
  "http://localhost:3000/auth/confirm?**",
  "http://localhost:3100/auth/callback",
  "http://localhost:3100/auth/callback?**",
  "http://localhost:3100/auth/confirm",
  "http://localhost:3100/auth/confirm?**",
]

jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

# Anyone may open a garden. This matches what Google sign-in has always done.
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

# Length over theatre. Forced symbols push people toward one memorised pattern
# and a sticky note; ten characters of anything is the better trade, and it is
# what current NIST guidance recommends.
minimum_password_length = 10
password_requirements = ""

[auth.email]
enable_signup = true
double_confirm_changes = true

# ⚠️ THIS MUST STAY TRUE. `supabase/migrations/0004_staff_allowlist.sql` grants
# the admin desk to any address in `staff_allowlist`, and guards that grant with
# `email_confirmed_at is not null`. That guard was written against a project
# where Google was the only provider and had already verified the address.
#
# With passwords enabled and confirmations OFF, anyone who signs up as
# admin@blissfulgardenz.com would be handed the desk. Confirmation is the only
# thing standing between a typed address and a claimed identity.
enable_confirmations = true

# Left off deliberately. Turning this on makes updateUser({password}) require a
# nonce fetched by a separate reauthentication *email*, which is a lot of
# machinery for a small membership site. `app/actions/auth.ts` gets the same
# protection more cheaply: it asks for the current password and verifies it
# before changing anything. Worth revisiting if the garden ever holds more.
secure_password_change = false

# One email per minute per address. Enough to recover from a mistyped address,
# slow enough that the reset form is not a free mailer.
max_frequency = "60s"
otp_length = 6
otp_expiry = 3600

# SMTP, WITHOUT WHICH NONE OF THIS WORKS.
#
# Supabase's built-in email service is a development convenience capped at a
# couple of messages per hour for the entire project. Confirmations and password
# resets are now on the critical path of signing in, so that cap would read to
# members as "the site is broken". Resend sends this site's other transactional
# mail, so auth mail goes the same way.
#
# ⚠️ PRECONDITION: the sending domain below must be VERIFIED IN RESEND before
# this is switched on. As of writing the Resend account has no verified domains
# at all (checked against its /domains API), which means every message sent from
# @mail.blissfulgardenz.com would be rejected outright — a worse failure than
# the built-in mailer's rate cap, because confirmations would not arrive and
# nobody could finish signing up.
#
# ON, now that mail.blissfulgardenz.com is verified in Resend. It was held off
# for one push while DNS propagated, because Resend rejects mail from an
# unverified domain and that would have failed harder than the rate cap it
# replaces: no confirmation emails at all, and confirmation is mandatory.
#
# If auth email ever stops arriving, check the domain's status in Resend first.
# A domain can fall out of verification if its DNS records are changed.
[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_API_KEY)"
admin_email = "hello@mail.blissfulgardenz.com"
sender_name = "Blissful Gardenz"

# The templates, in git alongside everything else.
#
# Both point at /auth/confirm with a `token_hash`, NOT at the default
# {{ .ConfirmationURL }}. Under PKCE the code verifier lives in the browser that
# *asked* for the link, so a reset requested on a laptop and opened on a phone
# would fail. A token_hash is verified server-side and works from any browser.
[auth.email.template.confirmation]
subject = "Confirm your email and open the garden"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Set a new password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirm your new email address"
content_path = "./supabase/templates/email_change.html"

# Two-factor, restored rather than chosen.
#
# The first push turned both of these OFF without meaning to. They were true on
# the project, this file said nothing about them, and `config push` filled the
# silence with the CLI's default of false — the exact failure this file's header
# warns about, demonstrated on the very first run. Nobody was affected (no
# factors were enrolled, checked against auth.mfa_factors), but with even one
# enrolled TOTP factor, verify_enabled = false would have locked that person out
# of their own account.
#
# So they are written down now. Not because the garden offers two-factor today,
# but because a config file that omits a setting is a config file that silently
# decides it.
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.rate_limit]
# Raised from the default of 2/hour, which assumed the built-in mailer. With
# Resend behind it the real constraint is abuse, not quota.
email_sent = 30
sms_sent = 30
anonymous_users = 30
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30
web3 = 30

[auth.sms]
enable_signup = false
enable_confirmations = false

# ── Providers ────────────────────────────────────────────────────────────────
# Secrets are never written here. `env(...)` is read from the environment at
# push time and the literal string is what lives in git.

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false

# Apple is off, and stated rather than omitted.
#
# `config push` fills in anything this file leaves out with a CLI default, so a
# provider that is simply absent and a provider that is deliberately disabled
# look identical in a diff. Writing it down means the next person reading this
# file learns a decision instead of guessing at an oversight.
#
# It was scoped and then dropped: Sign in with Apple needs a paid Apple Developer
# Program membership, and its client secret is a JWT that Apple caps at six
# months, so it is a recurring calendar obligation rather than a one-time setup.
# Google plus a password covers everyone without that. Turning it on later is
# this block with `enabled = true`, a Services ID and secret from
# developer.apple.com, and a second button in app/enter/enter-form.tsx.
[auth.external.apple]
enabled = false
